// Forge 1.20.1: compile all supported integrations, but exercise optional runtime boundaries.
// -PruntimeProfile=base|jei|emi|both|full (default full keeps the normal development mod set).
def v = libs.versions
def runtimeProfile = providers.gradleProperty('runtimeProfile').orElse('full').get()
if (!(runtimeProfile in ['base', 'jei', 'emi', 'both', 'full'])) {
    throw new GradleException("Unknown runtimeProfile '${runtimeProfile}'")
}

dependencies {
    minecraft "net.minecraftforge:forge:${v.minecraft.get()}-${v.forge.get()}"
    implementation "appeng:appliedenergistics2-forge:${v.ae2.get()}"

    // Never rely on an optional addon's embedded MixinExtras for an AE2-only installation.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${v.mixinextras.get()}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${v.mixinextras.get()}")) {
        jarJar.ranged(it, "[${v.mixinextras.get()},0.6)")
    }
    annotationProcessor "org.spongepowered:mixin:${v.mixin.get()}:processor"

    compileOnly fg.deobf("maven.modrinth:applied-energistics-2-wireless-terminals:${v.ae2wtlib.get()}")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${v.curios.get()}:api")
    compileOnly fg.deobf(libs.ae2wcwt)
    compileOnly "mezz.jei:jei-1.20.1-forge:${v.jei.get()}"
    compileOnly fg.deobf("maven.modrinth:emi:${v.emi.get()}")
    compileOnly fg.deobf("maven.modrinth:extendedae-plus:${v.extendedae.plus.get()}")
    compileOnly fg.deobf("org.appliedenergistics:guideme:${v.guideme.get()}")
    compileOnly fg.deobf("maven.modrinth:mekanism:${v.mekanism.get()}")
    compileOnly fg.deobf("maven.modrinth:applied-mekanistics:${v.applied.mek.get()}")
    compileOnly fg.deobf("maven.modrinth:advancedae:${v.advancedae.get()}")
    compileOnly fg.deobf("maven.modrinth:ae2-lightning-tech:${v.ae2lt.get()}")
    compileOnly fg.deobf("maven.modrinth:ae2-crystal-science:${v.ae2cs.get()}")
    compileOnly fg.deobf("maven.modrinth:sophisticated-core:${v.sophisticated.core.get()}")

    // GuideME is AE2's required runtime companion, not an optional integration.
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${v.guideme.get()}")
    if (runtimeProfile in ['jei', 'both', 'full']) {
        runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${v.jei.get()}")
    }
    if (runtimeProfile in ['emi', 'both']) {
        runtimeOnly fg.deobf("maven.modrinth:emi:${v.emi.get()}")
    }

    if (runtimeProfile == 'full') {
        runtimeOnly fg.deobf("maven.modrinth:applied-energistics-2-wireless-terminals:${v.ae2wtlib.get()}")
        runtimeOnly fg.deobf("maven.modrinth:neoecoae:${v.neoecoae.get()}")
        runtimeOnly fg.deobf("maven.modrinth:ldlib:${v.ldlib.get()}")
        runtimeOnly fg.deobf("maven.modrinth:thunderbolt-core:${v.thunderbolt.get()}")
        runtimeOnly fg.deobf("maven.modrinth:ae2-lightning-tech:${v.ae2lt.get()}")
        runtimeOnly fg.deobf("maven.modrinth:advancedae:${v.advancedae.get()}")
        runtimeOnly fg.deobf("maven.modrinth:geckolib:${v.geckolib.get()}")
        runtimeOnly fg.deobf("maven.modrinth:glodium:${v.glodium.get()}")
        runtimeOnly fg.deobf("maven.modrinth:extended-ae:${v.extendedae.epp.get()}")
        runtimeOnly fg.deobf("maven.modrinth:appflux:${v.appflux.get()}")
        runtimeOnly fg.deobf("maven.modrinth:extendedae-plus:${v.extendedae.plus.get()}")
        runtimeOnly fg.deobf("maven.modrinth:ae2-crystal-science:${v.ae2cs.get()}")
        runtimeOnly fg.deobf("maven.modrinth:mekanism:${v.mekanism.get()}")
        runtimeOnly fg.deobf("maven.modrinth:mekanism-generators:${v.mekanism.get()}")
        runtimeOnly fg.deobf("maven.modrinth:create:${v.create.get()}")
        runtimeOnly fg.deobf("maven.modrinth:applied-mekanistics:${v.applied.mek.get()}")
        runtimeOnly fg.deobf(libs.ae2wcwt)
        runtimeOnly fg.deobf(libs.cucumber)
        runtimeOnly fg.deobf(libs.mystical.agriculture)
        runtimeOnly fg.deobf(libs.mystical.agradditions)
        runtimeOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${v.cloth.get()}")
        runtimeOnly fg.deobf("dev.architectury:architectury-forge:${v.architectury.get()}")
        runtimeOnly fg.deobf("curse.maven:configuration-444699:${v.configuration.get()}")
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${v.curios.get()}")
        runtimeOnly fg.deobf("maven.modrinth:codechicken-lib:${v.codechicken.lib.get()}")
        runtimeOnly fg.deobf("maven.modrinth:brandons-core:${v.brandons.core.get()}")
        runtimeOnly fg.deobf("maven.modrinth:draconic-evolution:${v.draconic.evolution.get()}")
        runtimeOnly fg.deobf("maven.modrinth:modonomicon:${v.modonomicon.get()}")
        runtimeOnly fg.deobf("maven.modrinth:occultism:${v.occultism.get()}")
        runtimeOnly fg.deobf("maven.modrinth:sophisticated-core:${v.sophisticated.core.get()}")
        runtimeOnly fg.deobf("maven.modrinth:sophisticated-storage:${v.sophisticated.storage.get()}")
        runtimeOnly fg.deobf("maven.modrinth:sophisticated-backpacks:${v.sophisticated.backpacks.get()}")
        runtimeOnly fg.deobf("maven.modrinth:productivebees:${v.productivebees.get()}")
        runtimeOnly fg.deobf("maven.modrinth:jade:${v.jade.get()}")
        runtimeOnly fg.deobf("maven.modrinth:mega:${v.mega.cells.get()}")
        runtimeOnly fg.deobf("maven.modrinth:merequester:${v.merequester.get()}")
        runtimeOnly fg.deobf("maven.modrinth:applied-create:${v.applied.create.get()}")
        runtimeOnly fg.deobf("maven.modrinth:smartbrainlib:${v.smartbrainlib.get()}")
        runtimeOnly "maven.modrinth:kotlin-for-forge:${v.kotlin.for.forge.get()}"
        clientRuntimeOnly fg.deobf("maven.modrinth:justenoughcharacters:${v.jecharacters.get()}")
        clientRuntimeOnly fg.deobf("maven.modrinth:extreme_sound_muffler:${v.sound.muffler.get()}")
        clientRuntimeOnly fg.deobf("maven.modrinth:caramel-chat:${v.caramel.chat.get()}")
        clientRuntimeOnly fg.deobf("maven.modrinth:mouse-tweaks:${v.mouse.tweaks.get()}")
        clientRuntimeOnly fg.deobf("maven.modrinth:searchables:${v.searchables.get()}")
        clientRuntimeOnly fg.deobf("maven.modrinth:controlling:${v.controlling.get()}")
        clientRuntimeOnly fg.deobf("maven.modrinth:imblocker-original:${v.imblocker.get()}")
    }
}
