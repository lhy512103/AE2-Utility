// ──────────────────────────────────────────────────────────────
//  AE2: Utility – Forge 1.20.1
//  版本号 → gradle/libs.versions.toml   模组元数据 → gradle.properties
// ──────────────────────────────────────────────────────────────

buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

configurations {
    clientRuntimeOnly
}

apply plugin: 'org.spongepowered.mixin'
jarJar.enable()

def runtimeProfile = providers.gradleProperty('runtimeProfile').orElse('full').get()
def verificationRun = project.hasProperty('verificationRun')

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    // Do not pass --mixin.config here: Mixin bootstrap runs on the MC-BOOTSTRAP
    // layer, which cannot see the project's resources. FML loads mixins.json
    // from the exploded mod after discovery (see jar Manifest MixinConfigs).
}

// ── Forge & mappings ───────────────────────────────────────────
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            workingDirectory project.file(verificationRun ? "run/verification/${runtimeProfile}/client" : 'run/client')
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('migrationSmokeTest')) {
                property 'ae2utility.migrationSmokeTest', 'true'
            }
        }
        server {
            workingDirectory project.file(verificationRun ? "run/verification/${runtimeProfile}/server" : 'run/server')
            if (project.hasProperty('serverSmokeTest')) {
                if (!verificationRun) throw new GradleException('serverSmokeTest requires -PverificationRun')
                property 'ae2utility.serverSmokeTest', 'true'
            }
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

// ── 仓库 ──────────────────────────────────────────────────────
repositories {
    mavenCentral()

    maven {
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
            includeGroup 'de.mari_023'
            includeGroup 'org.appliedenergistics'
        }
    }

    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }

    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    // Non-exclusive: ForgeGradle remaps curse artifacts locally. exclusiveContent
    // made it look for *_mapped_official on CurseMaven and fail.
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://maven.architectury.dev/' }
}

// ── 依赖（抽取到 dependencies.gradle） ─────────────────────────
apply from: 'dependencies.gradle'

// ── 资源替换 ──────────────────────────────────────────────────
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : libs.versions.minecraft.get(),
            minecraft_version_range: "[${libs.versions.minecraft.get()},1.21)",
            forge_version          : libs.versions.forge.get(),
            forge_version_range    : '[47,)',
            loader_version_range   : '[47,)',
            ae2wtlib_version       : libs.versions.ae2wtlib.get(),
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    exclude 'META-INF/neoforge.mods.toml'

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

}

// Rebuilds of one tag must not differ solely due to archive entry timestamps.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
def releaseEpoch = providers.environmentVariable('SOURCE_DATE_EPOCH')
def manifestTimestamp = releaseEpoch.isPresent()
        ? java.time.Instant.ofEpochSecond(Long.parseLong(releaseEpoch.get())).toString()
        : 'reproducible-build'

// ── JAR manifest ──────────────────────────────────────────────
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': manifestTimestamp,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar).configure {
    archiveClassifier = ''
    manifest.from(tasks.named('jar', Jar).get().manifest)
    finalizedBy 'reobfJarJar'
}

// ── 客户端专用运行依赖 ──────────────────────────────────────────
tasks.withType(JavaExec).configureEach {
    if (name == 'runClient') {
        classpath += configurations.clientRuntimeOnly
        classpath += files(sourceSets.main.output.resourcesDir)
    }
}

// ── 编译选项 ──────────────────────────────────────────────────
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation fg.deobf("mezz.jei:jei-1.20.1-forge:${libs.versions.jei.get()}")
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn tasks.named('classes')
    source = fileTree('src/main/java') {
        include 'com/lhy/ae2utility/api/**/*.java'
        exclude '**/*Impl.java'
    }
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.register('apiJavadocJar', Jar) {
    dependsOn tasks.named('javadoc')
    archiveClassifier = 'api-javadoc'
    from tasks.named('javadoc').map { it.destinationDir }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('apiJavadocJar')
}
