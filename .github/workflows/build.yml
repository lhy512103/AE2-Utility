name: Build

on:
  push:
    branches: [neoforge-26.1.2]
  pull_request:
    branches: [neoforge-26.1.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test release gates without publishing
        run: python -m unittest discover -s .github/scripts/tests -v
      - name: Build and test
        run: bash gradlew build --no-configuration-cache
      - name: Validate release version, changelog and main JAR
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          python .github/scripts/release.py prepare --tag "neoforge-26.1.2-v$VERSION" --bundle release-check
          python .github/scripts/release.py pack --bundle release-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ae2utility-neoforge-26.1.2-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-${{ github.sha }}
          path: build/reports/tests/
          if-no-files-found: ignore
