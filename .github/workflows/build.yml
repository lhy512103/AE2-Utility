name: Build

on:
  push:
    branches: [neoforge-26.1.2]
  pull_request:
    branches: [neoforge-26.1.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test release gates without publishing
        run: python -m unittest discover -s .github/scripts/tests -v
      - name: Build and test
        run: bash gradlew build --no-configuration-cache
      - name: Validate release version, changelog and main JAR
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          python .github/scripts/release.py prepare --tag "neoforge-26.1.2-v$VERSION" --bundle release-check
          python .github/scripts/release.py pack --bundle release-check
      - uses: actions/upload-artifact@v4
        with:
          name: ae2utility-neoforge-26.1.2-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ github.sha }}
          path: build/reports/tests/
          if-no-files-found: ignore
