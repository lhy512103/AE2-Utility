pluginManagement {
    repositories {
        maven {
            url = "https://maven.neoforged.net/releases"
            content { includeGroupByRegex "net\\.neoforged.*" }
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'AE2-Utility-neoforge-26.1.2'
